apiVersion: apps/v1
kind: Deployment
metadata:
  name: liftlist
  namespace: liftlist
spec:
  replicas: 1
  # Migrations run in the entrypoint. Recreate keeps a rollout from briefly
  # running two pods (and two concurrent `migrate` calls) for a single replica.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: liftlist
  template:
    metadata:
      labels:
        app: liftlist
    spec:
      containers:
        - name: liftlist
          image: docker.io/nater55/liftlist:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: liftlist-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              # Kubelet probes use the pod IP as Host by default. Send the
              # public hostname so Django's ALLOWED_HOSTS accepts the request.
              httpHeaders:
                - name: Host
                  value: liftlist.naterobertstech.com
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                - name: Host
                  value: liftlist.naterobertstech.com
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
