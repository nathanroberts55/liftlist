apiVersion: apps/v1
kind: Deployment
metadata:
  name: liftlist
  namespace: liftlist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liftlist
  template:
    metadata:
      labels:
        app: liftlist
    spec:
      containers:
        - name: liftlist
          image: docker.io/nater55/liftlist:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: liftlist-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
