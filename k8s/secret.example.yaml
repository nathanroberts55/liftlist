# Template only. Create the real Secret with:
#   kubectl -n liftlist create secret generic app-secrets \
#     --from-literal=DJANGO_SECRET_KEY='...' \
#     --from-literal=DATABASE_URL='postgres://liftlist:...@postgres-host:5432/liftlist'
#
# Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: liftlist
type: Opaque
stringData:
  DJANGO_SECRET_KEY: ""
  DATABASE_URL: "postgres://liftlist:change-me@postgres-host:5432/liftlist"
  DJANGO_SUPERUSER_USERNAME: ""
  DJANGO_SUPERUSER_PASSWORD: ""
  DJANGO_SUPERUSER_EMAIL: ""
