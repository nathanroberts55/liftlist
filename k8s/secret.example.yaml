# Example only. Do not apply this file as the real Secret.
#
# Copy it to k8s/secrets.yaml, change metadata.name to `app-secrets`, and fill
# in real values. k8s/secrets.yaml is gitignored and must never be committed.
#
# DATABASE_URL is a standard libpq connection string:
#   postgres://ll_user:password@db-host:5432/liftlist
# URL-encode special characters in the password, or use an alphanumeric one.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets-example
  namespace: liftlist
type: Opaque
stringData:
  DJANGO_SECRET_KEY: ""
  DATABASE_URL: "postgres://ll_user:change-me@db-host:5432/liftlist"
  DJANGO_SUPERUSER_USERNAME: ""
  DJANGO_SUPERUSER_PASSWORD: ""
  DJANGO_SUPERUSER_EMAIL: ""
