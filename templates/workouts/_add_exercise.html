{% load icons %}
<section class="ll-card" aria-labelledby="add-exercise-title">
  <div class="flex items-center justify-between gap-2">
    <h1 id="add-exercise-title" class="text-lg font-semibold">Add exercise</h1>
    <a
      href="{% url 'session_run' session.pk %}"
      hx-get="{% url 'session_run' session.pk %}"
      hx-target="#runner"
      hx-swap="outerHTML"
      class="btn btn-ghost btn-square h-11 min-h-11 w-11"
      aria-label="Close add exercise sheet"
    >
      {% icon "x" css_class="size-5" %}
    </a>
  </div>

  <form
    method="get"
    action="{% url 'session_run' session.pk %}"
    hx-get="{% url 'session_picker' session.pk %}"
    hx-target="#picker-results"
    hx-swap="outerHTML"
    hx-trigger="input changed delay:300ms, submit"
    class="mt-3"
    role="search"
  >
    <input type="hidden" name="panel" value="add">
    <label for="exercise-search" class="mb-1 block text-[13px] font-medium text-base-content/60">Search exercises</label>
    <div class="relative">
      <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40" aria-hidden="true">
        {% icon "search" css_class="size-5" %}
      </span>
      <input
        id="exercise-search"
        name="q"
        type="search"
        value="{{ query }}"
        placeholder="Search by name"
        autocomplete="off"
        class="ll-input h-12 min-h-12 pl-10"
        data-autofocus
      >
    </div>
  </form>

  {% include "workouts/_picker.html" %}

  <p class="mt-3 text-[12px] text-base-content/40">
    Added exercises start with 3 sets and your default rest. You can add sets or skip it from the workout menu.
  </p>
</section>
