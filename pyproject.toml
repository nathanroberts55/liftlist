[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liftlist"
version = "0.1.0"
description = "Self-hosted workout planning and tracking."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "staticfiles",
    "static/vendor",
    ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "DJ", "SIM"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "liftlist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "liftlist.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
